<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bigg Boss Malayalam</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

/* FULL SCREEN VIDEO */

.intro{
    position:relative;
    width:100vw;
    height:100vh;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* DARK CINEMATIC OVERLAY */

.overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.9),
            rgba(0,0,0,.15) 50%,
            rgba(0,0,0,.6)
        );
    pointer-events:none;
}

/* ENTER BUTTON AREA */

.enter-area{
    position:absolute;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);

    text-align:center;

    opacity:0;
    visibility:hidden;

    transition:all .8s ease;
}

/* SHOW AFTER VIDEO */

.enter-area.show{
    opacity:1;
    visibility:visible;
}

/* TITLE */

.enter-title{
    color:#fff;
    font-size:14px;
    letter-spacing:5px;
    margin-bottom:18px;
    text-transform:uppercase;
    text-shadow:0 0 15px #ffb000;
}

/* BUTTON */

.enter-btn{
    position:relative;

    padding:18px 45px;

    border:2px solid #d99b00;
    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #ffcc33,
            #a96b00
        );

    color:#160d00;

    font-size:18px;
    font-weight:900;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 0 20px rgba(255,174,0,.5),
        0 0 50px rgba(255,174,0,.2);

    transition:.3s;
}

.enter-btn:hover{
    transform:scale(1.08);

    box-shadow:
        0 0 30px rgba(255,190,0,.9),
        0 0 80px rgba(255,160,0,.5);
}

/* SKIP BUTTON */

.skip-btn{
    position:absolute;

    top:25px;
    right:30px;

    padding:10px 18px;

    background:rgba(0,0,0,.55);

    border:1px solid rgba(255,255,255,.35);

    border-radius:25px;

    color:white;

    cursor:pointer;

    font-size:13px;

    backdrop-filter:blur(10px);

    transition:.3s;
}

.skip-btn:hover{
    background:rgba(255,255,255,.15);
}

/* LOADING TEXT */

.loading{
    position:absolute;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:white;

    font-size:12px;

    letter-spacing:4px;

    opacity:.7;

    transition:.5s;
}

.loading.hide{
    opacity:0;
}

/* MOBILE */

@media(max-width:600px){

    .enter-area{
        bottom:45px;
        width:100%;
    }

    .enter-title{
        font-size:10px;
        letter-spacing:3px;
    }

    .enter-btn{
        padding:15px 30px;
        font-size:14px;
    }

    .skip-btn{
        top:15px;
        right:15px;
    }
}

</style>
</head>

<body>

<div class="intro">

    <!-- YOUR LALETTAN INTRO VIDEO -->

    <video
        id="introVideo"
        autoplay
        playsinline
        preload="auto">

        <source src="bigboss/images/lalettan cutted.mp4" type="video/mp4">

        Your browser does not support video.
    </video>


    <!-- CINEMATIC DARK OVERLAY -->

    <div class="overlay"></div>


    <!-- LOADING -->

    <div class="loading" id="loading">
        LOADING HOUSE...
    </div>


    <!-- SKIP -->

    <button class="skip-btn" onclick="enterHouse()">
        SKIP INTRO
    </button>


    <!-- ENTER BUTTON -->

    <div class="enter-area" id="enterArea">

        <div class="enter-title">
            Welcome to the ultimate game
        </div>

        <button class="enter-btn" onclick="enterHouse()">
            ENTER BIGG BOSS HOUSE
        </button>

    </div>

</div>


<script>

const video = document.getElementById("introVideo");
const enterArea = document.getElementById("enterArea");
const loading = document.getElementById("loading");


/* VIDEO LOADED */

video.addEventListener("canplay", () => {

    loading.classList.add("hide");

});


/* VIDEO FINISHED */

video.addEventListener("ended", () => {

    enterArea.classList.add("show");

});


/* ENTER WEBSITE */

function enterHouse(){

    // Change this if your main website
    // has another filename

    window.location.href = "index2.html";

}


/* IF VIDEO FAILS */

video.addEventListener("error", () => {

    loading.innerHTML = "INTRO UNAVAILABLE";

    setTimeout(() => {
        enterArea.classList.add("show");
    }, 1000);

});

</script>

</body>
</html>
